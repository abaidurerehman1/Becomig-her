# Log the Host and forwarded protocol too: traffic for the domain arrives
# through the network gateway (10.100.0.1), direct-IP traffic does not.
log_format becoming_her '$remote_addr host=$host proto=$http_x_forwarded_proto [$time_local] '
                        '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Canonical address is https://becomingherformula.com (HTTPS is terminated at the
# gateway). Anything else reaching :9160, e.g. http://38.97.62.137:9160 or www,
# is redirected there, so the admin password is never sent over plain HTTP.
# /api/health stays reachable on any host for health checks.
map $host $becoming_her_off_domain {
    becomingherformula.com 0;
    default                1;
}

map "$becoming_her_off_domain:$uri" $becoming_her_redirect {
    "~^1:/api/health$" 0;
    "~^1:"             1;
    default            0;
}

server {
    listen 9160;
    listen [::]:9160;
    server_name _;

    root /opt/becoming-her/current/web;
    index index.html;

    access_log /var/log/nginx/becoming-her.access.log becoming_her;
    error_log  /var/log/nginx/becoming-her.error.log;

    if ($becoming_her_redirect) {
        return 301 https://becomingherformula.com$request_uri;
    }

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Note: any location that sets add_header drops the server-level ones,
    # so the security headers are repeated per location.

    location /api/ {
        proxy_pass http://127.0.0.1:9161;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # single-page app: "/" and "/admin" both serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
